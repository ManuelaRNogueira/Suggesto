<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/authGuard.js"></script>
  <title>Sugestões — Suggesto</title>
  <link rel="icon" type="image/png" href="imagens/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admBase.css">
  <link rel="stylesheet" href="css/inicioAdm.css">
  <link rel="stylesheet" href="css/sugestoesAdm.css">
  <link rel="stylesheet" href="css/sidebarMobile.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <img src="imagens/logo.png" alt="Logo" class="logo-img-sidebar">
    </div>
    <div class="logo-text">
      Suggesto
      <span>Painel Admin</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Principal</div>

    <a class="nav-item" href="inicioAdm.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Início
    </a>

    <a class="nav-item active" href="sugestoesAdm.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Sugestões
    </a>

    <a class="nav-item nav-item-disabled" href="download.html" data-desktop-only="true">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M18 20V10M12 20V4M6 20v-6"/>
      </svg>
      Estatísticas
      <span class="nav-badge">App</span>
    </a>

    <a class="nav-item nav-item-disabled" href="download.html" data-desktop-only="true">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Perfil
      <span class="nav-badge">App</span>
    </a>

    <div class="nav-section-label">Equipe</div>

    <a class="nav-item" href="equipe.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Acesso rápido à equipe
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="sb-avatar" id="contaAvatar">—</div>
      <div class="sb-user-info">
        <div class="sb-user-name" id="contaNome">—</div>
        <div class="sb-user-role" id="contaEmail">Administrador</div>
      </div>
      <button type="button" class="user-sair" id="btnSair" title="Sair">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>
</aside>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<main class="conteudo">

  <header class="conteudo-header">
    <button class="sidebar-hamburguer" id="sidebarToggle" aria-label="Abrir menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <p class="header-saudacao" id="resumoSub">Carregando…</p>
    <h1 class="header-titulo">Sugestões</h1>
  </header>

  <div id="erro" class="resumo-erro" hidden></div>

  <div id="estadoCarregando" class="estado-carregando">Carregando sugestões…</div>

  <div id="conteudoSugestoes" hidden>

    <div class="sug-topo">
      <label class="sug-busca">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" class="sug-busca-campo" id="campoBusca" placeholder="Buscar por texto, autor ou local…">
      </label>
      <button type="button" class="btn-acao" id="btnExportarCsv">Exportar CSV</button>
    </div>

    <div class="sug-filtros">
      <div class="sug-chips" id="chipsStatus"></div>
      <select class="sug-ordem" id="selectOrdem">
        <option value="recente">Mais recentes</option>
        <option value="prioridade">Prioridade (nível)</option>
        <option value="antigo">Mais antigas</option>
        <option value="nota">Maior nota</option>
        <option value="az">A–Z</option>
      </select>
    </div>

    <div class="sug-grade">
      <div class="sug-lista-col">
        <ul class="sug-lista" id="listaSugestoes"></ul>
        <nav class="sug-paginacao" id="paginacao" hidden>
          <button type="button" class="btn-acao" id="btnPaginaAnterior">Anterior</button>
          <span class="sug-paginacao-info" id="paginacaoInfo"></span>
          <button type="button" class="btn-acao" id="btnPaginaProxima">Próxima</button>
        </nav>
      </div>

      <aside class="sug-painel">
        <section class="resumo-cartao">
          <div class="resumo-cartao-topo">
            <h2>Categoria</h2>
          </div>
          <ul class="sug-cats" id="listaCategorias"></ul>
        </section>
      </aside>
    </div>

  </div>

</main>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/admApi.js"></script>
<script src="js/sugestoesAdm.js"></script>
<script src="js/sidebarMobile.js"></script>
</body>
</html>
