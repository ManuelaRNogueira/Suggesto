spring.application.name=backend

# Sem SPRING_PROFILES_ACTIVE definido (é o caso do Render hoje), cai em "prod" —
# ou seja, comportamento em produção continua idêntico ao de antes. Pra rodar
# local, ative o profile "local" (ver application-local.properties): passe
# --spring.profiles.active=local ao rodar a API — nada disso exige mudar nada
# no Render.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Comum a todos os ambientes.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Origens liberadas pro CORS, separadas por vírgula. "*" (padrão) libera qualquer
# origem — igual ao comportamento de sempre, então isso não muda nada em
# produção sem CORS_ALLOWED_ORIGINS definido. Pra restringir (ex: só o site em
# produção + localhost), defina algo como:
#   CORS_ALLOWED_ORIGINS=http://localhost:5173,https://suggesto-site.onrender.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Client ID do "Entrar com Google" (público), igual em local e prod. A variável
# GOOGLE_CLIENT_ID substitui o padrão se precisar. A chave secreta do OAuth não
# é usada nesse fluxo.
google.client-id=${GOOGLE_CLIENT_ID:342563067513-3890o57ajbheevan610o669dldra5g86.apps.googleusercontent.com}

# E-mail (recuperação de senha) pela API HTTP do Brevo — o Render gratuito
# bloqueia SMTP. A chave vem de BREVO_API_KEY, configurada no painel do Render;
# nunca coloque o valor real aqui. O remetente é público.
brevo.api-key=${BREVO_API_KEY:}
brevo.remetente-nome=Suggesto
brevo.remetente-email=projetosuggesto@gmail.com

# Endereço do site, usado pra montar o link de redefinição de senha do e-mail.
# O profile "local" troca pelo Live Server (ver application-local.properties).
app.site-url=${SITE_URL:https://suggestosite.onrender.com}
