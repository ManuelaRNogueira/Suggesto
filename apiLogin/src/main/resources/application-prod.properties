# Profile "prod" — é o que o Render usa (é o profile padrão quando
# SPRING_PROFILES_ACTIVE não está definido, ver application.properties).
# Os valores default de cada ${VAR:default} abaixo são exatamente os que já
# estavam fixos antes — então sem nenhuma variável nova configurada no Render,
# o comportamento continua idêntico ao de sempre.

# O Render injeta a porta em PORT; local (rodando com profile prod) continua em 8080.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://143.106.241.4:3306/cl204225?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&nullCatalogMeansCurrent=true}
spring.datasource.username=${DB_USERNAME:cl204225}
# A senha do banco vem da variável de ambiente DB_PASSWORD (nunca commitada).
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Credenciais do Cloudinary vêm de variáveis de ambiente (nunca commitadas).
# Sem elas configuradas, o upload de fotos cai para o disco local automaticamente.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
