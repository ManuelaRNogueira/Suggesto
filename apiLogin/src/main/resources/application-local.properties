# Profile "local" — pra rodar a API na sua máquina sem precisar configurar
# banco nenhum. Banco H2 em memória: sobe zerado a cada execução (o Hibernate
# cria as tabelas sozinho, igual já faz em produção com ddl-auto=update) e some
# quando a aplicação para. Não toca em nada do banco de produção.

server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:suggesto;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2, só pra debugar o banco em memória enquanto a API está de
# pé: http://localhost:8080/h2-console (JDBC URL igual à de cima, usuário "sa",
# senha em branco).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cloudinary desligado localmente — upload de foto cai pro disco automaticamente
# (ver UploadStorage), sem precisar de conta/credenciais nenhuma.
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=
